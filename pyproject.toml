[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "prydwen-py"
version = "0.1.0"
description = "Async Prydwen guide data with typed models and persistent caching."
readme = "README.md"
requires-python = ">=3.11"
keywords = ["prydwen", "endfield", "asyncio", "pydantic"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Framework :: AsyncIO",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
dependencies = [
    "aiohttp>=3.10,<4",
    "beautifulsoup4>=4.12,<5",
    "cloudscraper>=1.2.71,<2",
    "lxml>=5,<7",
    "pydantic>=2.8,<3",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25,<2", "ruff>=0.9", "mypy>=1.14", "types-beautifulsoup4", "types-requests", "build>=1.2"]
docs = ["mkdocs>=1.6,<2", "mkdocs-material>=9.6,<10"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
prydwen = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-m 'not live'"
markers = ["live: opt-in requests to the real Prydwen site"]

[tool.ruff]
target-version = "py311"
line-length = 110

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP", "B"]

[tool.mypy]
python_version = "3.11"
files = ["src/prydwen"]
check_untyped_defs = true
disallow_untyped_defs = true
warn_unused_ignores = true
disable_error_code = ["prop-decorator"]

[[tool.mypy.overrides]]
module = ["cloudscraper", "cloudscraper.*"]
ignore_missing_imports = true
